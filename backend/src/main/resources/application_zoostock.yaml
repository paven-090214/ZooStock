# ZooStock application.yaml
# This file preserves the backend settings from the suhwan branch.
# Initial taxon IDs are the 10 entries currently listed in AnimalApiGet.java.
# Run generate_animal_yaml.py to create a VERIFIED 150-ID application_zoostock_150.yaml.

server:
  port: 8079

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: zoostock-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

animal:
  import:
    enabled: true
    target-counts:
      Mammalia: 43
      Aves: 33
      Reptilia: 28
